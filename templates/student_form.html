{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-lg-8">

        <div class="card shadow-sm border-0 rounded-4">
            <div class="card-body p-4">

                <h1 class="fw-bold mb-2">{{ action }} Student</h1>
                <p class="text-muted mb-4">
                    Fill the form below to {{ action | lower }} a student record.
                </p>

                <form method="POST">
                    <div class="row g-3">

                        <div class="col-md-6">
                            <label class="form-label">Full Name *</label>
                            <input
                                type="text"
                                name="name"
                                class="form-control"
                                value="{{ student.name if student else '' }}"
                                required
                            >
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Email *</label>
                            <input
                                type="email"
                                name="email"
                                class="form-control"
                                value="{{ student.email if student else '' }}"
                                required
                            >
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Phone</label>
                            <input
                                type="text"
                                name="phone"
                                class="form-control"
                                value="{{ student.phone if student else '' }}"
                            >
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Course *</label>
                            <input
                                type="text"
                                name="course"
                                class="form-control"
                                value="{{ student.course if student else '' }}"
                                required
                            >
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Semester</label>
                            <input
                                type="text"
                                name="semester"
                                class="form-control"
                                value="{{ student.semester if student else '' }}"
                            >
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">City</label>
                            <input
                                type="text"
                                name="city"
                                class="form-control"
                                value="{{ student.city if student else '' }}"
                            >
                        </div>

                    </div>

                    <div class="mt-4 d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            {{ action }} Student
                        </button>

                        <a href="{{ url_for('students') }}" class="btn btn-outline-secondary">
                            Cancel
                        </a>
                    </div>
                </form>

            </div>
        </div>

    </div>
</div>

{% endblock %}
